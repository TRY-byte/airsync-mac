name: Build AirSync DMG

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Archive (Self Compiled scheme, with retry for flaky icontool)
        run: |
          set +e
          i=1
          while [ $i -le 5 ]; do
            echo "Archive attempt $i..."
            xcodebuild archive -project AirSync.xcodeproj -scheme "AirSync Self Compiled" -configuration Release -destination "generic/platform=macOS" -archivePath build/AirSync.xcarchive CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES
            code=$?
            if [ $code -eq 0 ]; then
              echo "Archive succeeded on attempt $i"
              exit 0
            fi
            if [ $code -ne 65 ]; then
              echo "Got unexpected exit code $code, not retrying"
              exit $code
            fi
            echo "Got exit 65, retrying..."
            sleep 5
            i=$((i+1))
          done
          echo "All retries exhausted"
          exit 65
            
      - name: Pull the .app out of the archive
        run: |
          mkdir -p build/export
          cp -R "build/AirSync.xcarchive/Products/Applications/AirSync.app" build/export/

      - name: Pack into a DMG
        run: |
          hdiutil create -volname "AirSync" \
            -srcfolder build/export \
            -ov -format UDZO \
            build/AirSync.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-dmg
          path: build/AirSync.dmg
